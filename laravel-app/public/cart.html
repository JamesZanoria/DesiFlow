<!-- prototype code, to be revised when backend is prepped -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <title>DesiFlow - Cart & Current Order (new look)</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Instrument Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } }
    </script>
    <style>
        button{transition-duration:.22s!important}
        .card-in{animation:cardIn .3s ease-out backwards}
        @keyframes cardIn{from{opacity:0;transform:translateY(8px)}}
        #confirm-overlay{opacity:0;visibility:hidden;transition:opacity .25s ease,visibility 0s linear .25s}
        #confirm-overlay.open{opacity:1;visibility:visible;transition:opacity .25s ease}
        #confirm-panel{transform:scale(.94) translateY(8px);transition:transform .3s cubic-bezier(.22,.9,.3,1)}
        #confirm-overlay.open #confirm-panel{transform:none}
        @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    </style>
</head>
<body class="bg-stone-100 font-sans text-slate-900 flex items-center justify-center min-h-screen">

    <div class="bg-amber-50 w-full max-w-sm h-[100dvh] sm:h-[min(800px,94dvh)] sm:rounded-3xl sm:shadow-2xl relative flex flex-col overflow-hidden">

        <header class="relative bg-gradient-to-br from-amber-300 to-amber-500 px-5 pb-6 rounded-b-[2rem] shadow-lg shadow-amber-900/10" style="padding-top:max(1.25rem,env(safe-area-inset-top))">
            <div class="flex items-center justify-between">
                <button onclick="location.href='menu.html'" class="w-10 h-10 rounded-full bg-white text-slate-900 shadow-md hover:bg-amber-50 flex items-center justify-center" aria-label="Back to menu"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg></button>
                <div id="table-indicator" class="bg-white text-slate-900 text-xs font-bold px-3 py-1.5 rounded-full shadow">Table ?</div>
            </div>
            <div class="mt-4">
                <p class="text-[11px] font-bold text-amber-900/70 uppercase tracking-widest">Review your order</p>
                <h1 class="text-2xl font-extrabold text-slate-900 leading-tight">My Cart</h1>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 pb-52">
            <div id="cart-items-container" class="space-y-3"></div>
        </main>

        <div class="absolute bottom-0 left-0 right-0 bg-white border-t border-amber-100 rounded-t-3xl px-5 py-4 shadow-[0_-8px_24px_rgba(15,23,42,0.08)] space-y-3" style="padding-bottom:max(1rem,env(safe-area-inset-bottom))">
            <div class="flex justify-between text-sm">
                <span class="text-slate-500">Subtotal</span>
                <span id="cart-subtotal" class="font-semibold text-slate-800">₱ 0.00</span>
            </div>
            <div class="flex justify-between items-center border-t border-slate-100 pt-3">
                <span class="font-bold text-slate-900">Total</span>
                <span id="cart-total" class="font-extrabold text-slate-900 text-xl">₱ 0.00</span>
            </div>
            <button id="place-btn" onclick="placeOrder()" class="w-full bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold py-3 rounded-xl shadow-md shadow-amber-900/20 active:scale-95 transition disabled:bg-slate-200 disabled:text-slate-400 disabled:shadow-none disabled:cursor-not-allowed">
                Place order to kitchen
            </button>
        </div>

        <!-- Remove-dish confirmation -->
        <div id="confirm-overlay" class="absolute inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-6" onclick="if(event.target===this)closeConfirm()">
            <div id="confirm-panel" class="bg-white rounded-3xl shadow-2xl w-full overflow-hidden" role="dialog" aria-modal="true">
                <div class="p-7 text-center">
                    <div class="mx-auto w-14 h-14 rounded-full bg-red-500 flex items-center justify-center mb-5">
                        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.35 9m-4.78 0L9.26 9m9.97-3.21c.34.05.68.11 1.02.17m-1.02-.17L18.16 19.67a2.25 2.25 0 01-2.24 2.08H8.08a2.25 2.25 0 01-2.24-2.08L4.77 5.79m14.46 0a48.1 48.1 0 00-3.48-.4m-12 .57c.34-.06.68-.12 1.02-.17m0 0a48.1 48.1 0 013.48-.4m7.5 0v-.92c0-1.18-.91-2.16-2.09-2.2a51.96 51.96 0 00-3.32 0c-1.18.04-2.09 1.02-2.09 2.2v.92m7.5 0a48.67 48.67 0 00-7.5 0"/></svg>
                    </div>
                    <h3 class="text-lg font-bold text-slate-900 mb-1">Remove this dish?</h3>
                    <p class="text-sm text-slate-500 leading-relaxed"><span id="confirm-name" class="font-semibold text-slate-700"></span> will be removed from your cart.</p>
                </div>
                <div class="px-5 py-4 bg-slate-50 flex gap-3">
                    <button onclick="closeConfirm()" class="flex-1 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-200 transition">Keep it</button>
                    <button onclick="confirmRemove()" class="flex-1 py-2.5 rounded-xl text-sm font-bold text-white bg-red-500 hover:bg-red-600 shadow-sm active:scale-95 transition">Remove</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const peso = n => '₱ ' + Number(n).toFixed(2);
        const getCart = () => JSON.parse(sessionStorage.getItem('cart_items') || '[]');
        const saveCart = c => sessionStorage.setItem('cart_items', JSON.stringify(c));

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('table-indicator').innerText = 'Table ' + (sessionStorage.getItem('active_table') || '1');
            loadCartItems();
        });

        function loadCartItems() {
    const box = document.getElementById('cart-items-container');
    const cart = getCart();
    document.getElementById('place-btn').disabled = cart.length === 0;

    if (!cart.length) {
        box.innerHTML = `
            <div class="text-center py-16 space-y-3">
                <p class="text-slate-400 text-sm">Your cart is empty. Pick something from the menu to get started.</p>
                <button onclick="location.href='menu.html'" class="bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold px-5 py-2.5 rounded-xl shadow">Browse menu</button>
            </div>`;
        updateTotals(cart); return;
    }

    box.innerHTML = cart.map((item, i) => `
        <div class="bg-white border border-amber-100 rounded-3xl p-3.5 shadow-sm card-in flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-16 h-16 shrink-0 rounded-2xl bg-amber-100 flex items-center justify-center text-[10px] text-amber-700/60 overflow-hidden">
                    ${item.image ? `<img src="${item.image}" class="w-full h-full object-cover" alt="">` : 'No photo'}
                </div>
                <div class="min-w-0">
                    <h4 class="font-bold text-sm text-slate-900 truncate">${item.name}</h4>
                    ${(item.addons && item.addons.length) ? `<p class="text-xs text-slate-400 truncate">+ ${item.addons.map(a => a.name).join(', ')}</p>` : `<p class="text-xs text-slate-400 capitalize">${item.category}</p>`}
                    <p class="text-sm font-extrabold text-slate-900 mt-1">${peso(item.price)} each</p>
                </div>
            </div>
            <div class="flex flex-col items-end gap-2 shrink-0">
                <div class="flex items-center gap-1">
                    <button onclick="editCartItem(${i})" class="w-8 h-8 rounded-xl text-slate-400 hover:text-amber-500 hover:bg-amber-50 flex items-center justify-center transition" aria-label="Edit ${item.name}">
                        <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10"/></svg>
                    </button>
                    <button onclick="askRemove(${i})" class="w-8 h-8 rounded-xl text-slate-400 hover:text-red-500 hover:bg-red-50 flex items-center justify-center transition" aria-label="Remove ${item.name}">
                        <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.35 9m-4.78 0L9.26 9m9.97-3.21c.34.05.68.11 1.02.17m-1.02-.17L18.16 19.67a2.25 2.25 0 01-2.24 2.08H8.08a2.25 2.25 0 01-2.24-2.08L4.77 5.79m14.46 0a48.1 48.1 0 00-3.48-.4m-12 .57c.34-.06.68-.12 1.02-.17m0 0a48.1 48.1 0 013.48-.4m7.5 0v-.92c0-1.18-.91-2.16-2.09-2.2a51.96 51.96 0 00-3.32 0c-1.18.04-2.09 1.02-2.09 2.2v.92m7.5 0a48.67 48.67 0 00-7.5 0"/></svg>
                    </button>
                </div>
                <div class="flex items-center bg-amber-100 rounded-xl">
                    <button onclick="updateQuantity(${i}, -1)" class="w-8 h-8 font-bold text-slate-600 hover:text-amber-600" aria-label="Decrease">&minus;</button>
                    <span class="w-6 text-center text-sm font-bold">${item.quantity}</span>
                    <button onclick="updateQuantity(${i}, 1)" class="w-8 h-8 font-bold text-slate-600 hover:text-amber-600" aria-label="Increase">+</button>
                </div>
            </div>
        </div>`).join('');
    updateTotals(cart);
}
   
        function editCartItem(i) {
    const cart = getCart();
    const item = cart[i];
    if (!item) return;
    
    // Save which cart index we are editing
    sessionStorage.setItem('edit_cart_index', i);
    
    // Redirect to menu page with the dish ID in the URL
    location.href = `menu.html?open_item=${item.id}`;
}

        function updateQuantity(i, change) {
            const cart = getCart();
            if (!cart[i]) return;
            if (cart[i].quantity + change <= 0) { askRemove(i); return; }
            cart[i].quantity += change;
            saveCart(cart); loadCartItems();
        }

        let removeIndex = null;
        function askRemove(i) {
            const item = getCart()[i];
            if (!item) return;
            removeIndex = i;
            document.getElementById('confirm-name').innerText = item.name;
            const o = document.getElementById('confirm-overlay');
            o.classList.add('open');
        }
        function closeConfirm() {
            const o = document.getElementById('confirm-overlay');
            o.classList.remove('open');
            removeIndex = null;
        }
        function confirmRemove() {
            const cart = getCart();
            if (removeIndex !== null && cart[removeIndex]) { cart.splice(removeIndex, 1); saveCart(cart); }
            closeConfirm(); loadCartItems();
        }
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeConfirm(); });

        function updateTotals(cart) {
            const sub = cart.reduce((s, it) => s + it.price * it.quantity, 0);
            document.getElementById('cart-subtotal').innerText = peso(sub);
            document.getElementById('cart-total').innerText = peso(sub);
        }

        function placeOrder() {
            const cart = getCart();
            if (!cart.length) return;
            const history = JSON.parse(sessionStorage.getItem('order_history') || '[]');
            history.push({
                orderId: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                items: cart,
                status: 'Sent to Kitchen'
            });
            sessionStorage.setItem('order_history', JSON.stringify(history));
            sessionStorage.removeItem('cart_items');
            alert('Order placed. The kitchen has received it.');
            location.href = 'tracking.html';
        }
    </script>
</body>
</html>
