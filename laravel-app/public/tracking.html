<!-- prototype code, to be revised when backend is prepped -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DesiFlow - Order Confirmed & Tracking</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Instrument Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } }
    </script>
    <style>
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-stone-100 font-sans text-slate-900 flex items-center justify-center min-h-screen">

    <div class="bg-white w-full max-w-sm h-[100dvh] sm:h-[min(800px,94dvh)] sm:rounded-3xl sm:shadow-2xl relative flex flex-col overflow-hidden fade-in">
        
        <!-- Header Banner -->
        <header class="bg-green-600 text-center py-4 text-white font-bold tracking-wide shadow-md" style="padding-top:max(1rem,env(safe-area-inset-top))">
            Order Confirmed!
        </header>

        <main class="flex-1 overflow-y-auto px-6 py-6 pb-24 flex flex-col items-center">
            
            <!-- Order Number & Cashier Notice -->
            <p class="text-sm font-semibold text-slate-500 mb-1">Your Order Number:</p>
            <h1 id="order-number" class="text-5xl font-extrabold text-amber-500 drop-shadow-sm mb-3">#----</h1>
            <p class="text-xs font-bold text-red-500 mb-8 tracking-wide">Present to Cashier to finalize payment.</p>

            <!-- Live Tracking Visualizer -->
            <div class="w-full mb-8">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest text-center mb-2">Live Tracking</p>
                <div class="w-full h-4 bg-slate-200 rounded-full overflow-hidden border border-slate-300">
                    <div id="progress-bar" class="h-full bg-amber-400 w-1/4 transition-all duration-1000 ease-in-out"></div>
                </div>
                <p class="text-center text-sm font-semibold text-slate-600 mt-3">Est. Waiting Time: <span id="wait-time" class="text-slate-900 font-bold">15 mins</span></p>
                <p id="live-status" class="text-center text-xs font-bold text-amber-600 mt-1">Sent to Kitchen</p>
            </div>

            <!-- Digital Receipt -->
            <div class="w-full border-2 border-dashed border-slate-300 rounded-2xl p-5 bg-slate-50 relative">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest text-center mb-4 bg-slate-50 px-2 absolute -top-2.5 left-1/2 -translate-x-1/2">Digital Receipt</p>
                
                <div id="receipt-items" class="space-y-2 text-sm font-medium text-slate-700 mb-4 border-b border-slate-200 pb-4">
                    <!-- Items injected here -->
                </div>
                
                <div class="flex justify-between items-center font-extrabold text-slate-900">
                    <span>Total</span>
                    <span id="receipt-total">₱ 0.00</span>
                </div>
            </div>
        </main>

        <div class="absolute bottom-0 left-0 right-0 p-5 bg-white border-t border-slate-100" style="padding-bottom:max(1.25rem,env(safe-area-inset-bottom))">
            <button onclick="location.href='history.html'" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3.5 rounded-xl transition shadow-sm border border-slate-200">
                Return to Dashboard
            </button>
        </div>
    </div>

    <script>
        const peso = n => '₱ ' + Number(n).toFixed(2);
        
        document.addEventListener('DOMContentLoaded', () => {
            const history = JSON.parse(sessionStorage.getItem('order_history') || '[]');
            if (!history.length) return;
            
            // Grab the most recently placed order
            const latestOrder = history[history.length - 1];
            
            document.getElementById('order-number').innerText = latestOrder.orderId;
            
            // Populate Receipt
            const receiptContainer = document.getElementById('receipt-items');
            let total = 0;
            
            receiptContainer.innerHTML = latestOrder.items.map(item => {
                const lineTotal = item.price * item.quantity;
                total += lineTotal;
                return `
                    <div class="flex justify-between items-start">
                        <span>${item.quantity}x ${item.name}</span>
                        <span>${peso(lineTotal)}</span>
                    </div>
                `;
            }).join('');
            
            document.getElementById('receipt-total').innerText = peso(total);

            // Prototype Simulation: Progress bar advances after 3 seconds
            setTimeout(() => {
                document.getElementById('progress-bar').style.width = '60%';
                document.getElementById('live-status').innerText = 'Preparing';
                document.getElementById('wait-time').innerText = '12 mins';
                
                // Update status in storage for the history page
                latestOrder.status = 'Preparing';
                sessionStorage.setItem('order_history', JSON.stringify(history));
            }, 3000);
        });
    </script>
</body>
</html>
