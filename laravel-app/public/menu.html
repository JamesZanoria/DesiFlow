<!-- prototype code, to be revised when backend is prepped -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <title>DesiFlow - Menu Catalog</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Instrument Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } }
    </script>
    <style>
        .no-scrollbar{scrollbar-width:none}.no-scrollbar::-webkit-scrollbar{display:none}
        .swipe-card{touch-action:pan-y;-webkit-user-select:none;user-select:none}
        button{transition-duration:.22s!important}
        .card-in{animation:cardIn .2s ease-out backwards}
        @keyframes cardIn{from{opacity:0;transform:translateY(6px)}}
        #overlay{opacity:0;visibility:hidden;transition:opacity .28s ease,visibility 0s linear .28s}
        #overlay.open{opacity:1;visibility:visible;transition:opacity .28s ease}
        #overlay-panel{transform:translateY(36px);transition:transform .34s cubic-bezier(.22,.9,.3,1)}
        #overlay.open #overlay-panel{transform:none}
        #toast{opacity:0;transform:translate(-50%,10px);pointer-events:none;transition:opacity .25s ease,transform .25s ease}
        #toast.show{opacity:1;transform:translate(-50%,0)}
        @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    </style>
</head>
<body class="bg-stone-100 font-sans text-slate-900 flex items-center justify-center min-h-screen">

    <div class="bg-amber-50 w-full max-w-sm h-[100dvh] sm:h-[min(800px,94dvh)] sm:rounded-3xl sm:shadow-2xl relative flex flex-col overflow-hidden">

        <!-- Header -->
        <header class="relative bg-gradient-to-br from-amber-300 to-amber-500 px-5 pb-6 rounded-b-[2rem] shadow-lg shadow-amber-900/10" style="padding-top:max(1.25rem,env(safe-area-inset-top))">
            <div class="flex items-center justify-between">
                <button onclick="location.href='/dashboard.html'" class="w-10 h-10 rounded-full bg-white text-slate-900 shadow-md hover:bg-amber-50 flex items-center justify-center" aria-label="Back"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg></button>
                <div class="flex items-center gap-2">
                    <button onclick="location.href='/history.html'" class="w-10 h-10 rounded-full bg-white text-slate-900 shadow-md hover:bg-amber-50 flex items-center justify-center" aria-label="Order history">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2m5-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </button>
                    <button id="cart-btn" onclick="location.href='cart.html'" class="relative z-[45] w-10 h-10 rounded-full bg-white text-slate-900 shadow-md hover:bg-amber-50 flex items-center justify-center" aria-label="Cart">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.3 2.3c-.6.6-.2 1.7.7 1.7H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                        <span id="cart-badge" class="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 bg-red-500 text-white text-[10px] rounded-full flex items-center justify-center font-bold border-2 border-white">0</span>
                    </button>
                </div>
            </div>
            <div class="mt-4">
                <p class="text-[11px] font-bold text-amber-900/70 uppercase tracking-widest">Desi Zaika</p>
                <h1 class="text-2xl font-extrabold text-slate-900 leading-tight">What are you craving?</h1>
            </div>
        </header>

        <!-- Category tabs -->
        <nav id="category-nav" class="px-4 pt-4 overflow-x-auto whitespace-nowrap flex gap-2 no-scrollbar scroll-smooth">
            <button onclick="filterCategory('all')" id="tab-all" class="category-tab px-4 py-1.5 rounded-full text-sm font-semibold transition bg-slate-900 text-white shadow-sm">All</button>
            <button onclick="filterCategory('main course')" id="tab-main" class="category-tab px-4 py-1.5 rounded-full text-sm font-semibold transition bg-white text-slate-600 border border-amber-200 hover:bg-amber-100">Main Course</button>
            <button onclick="filterCategory('appetizers')" id="tab-appetizers" class="category-tab px-4 py-1.5 rounded-full text-sm font-semibold transition bg-white text-slate-600 border border-amber-200 hover:bg-amber-100">Appetizers</button>
            <button onclick="filterCategory('breads')" id="tab-breads" class="category-tab px-4 py-1.5 rounded-full text-sm font-semibold transition bg-white text-slate-600 border border-amber-200 hover:bg-amber-100">Breads</button>
            <button onclick="filterCategory('sides')" id="tab-sides" class="category-tab px-4 py-1.5 rounded-full text-sm font-semibold transition bg-white text-slate-600 border border-amber-200 hover:bg-amber-100">Sides</button>
            <button onclick="filterCategory('snacks')" id="tab-snacks" class="category-tab px-4 py-1.5 rounded-full text-sm font-semibold transition bg-white text-slate-600 border border-amber-200 hover:bg-amber-100">Snacks</button>
            <button onclick="filterCategory('drinks')" id="tab-drinks" class="category-tab px-4 py-1.5 rounded-full text-sm font-semibold transition bg-white text-slate-600 border border-amber-200 hover:bg-amber-100">Drinks</button>
            <button onclick="filterCategory('desserts')" id="tab-desserts" class="category-tab px-4 py-1.5 rounded-full text-sm font-semibold transition bg-white text-slate-600 border border-amber-200 hover:bg-amber-100">Desserts</button>
        </nav>

        <main class="flex-1 overflow-y-auto p-4 space-y-3 pb-8">
            <div>
                <h2 id="category-title" class="text-sm font-semibold text-slate-500">Full menu</h2>
                <p class="text-xs text-slate-400 mt-0.5">Tip: swipe right on any dish to quick-add it to your cart.</p>
            </div>
            <div id="menu-container" class="grid grid-cols-2 gap-3"></div>
        </main>

        <!-- ITEM DETAIL OVERLAY -->
        <div id="overlay" class="absolute inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-end justify-center" onclick="if(event.target===this)closeOverlay()">
            <div id="overlay-panel" class="bg-white w-full max-w-md rounded-t-3xl shadow-2xl max-h-[90%] overflow-y-auto" role="dialog" aria-modal="true" aria-labelledby="ov-name">
                <div class="p-5">
                    <div class="relative">
                        <div class="h-44 rounded-2xl bg-slate-100 border border-dashed border-slate-300 flex items-center justify-center text-slate-400 text-sm font-medium overflow-hidden">
                            <img id="ov-img" class="hidden w-full h-full object-cover" alt="">
                            <span id="ov-img-ph">No photo yet</span>
                        </div>
                        <button onclick="closeOverlay()" class="absolute top-2 right-2 w-8 h-8 rounded-full bg-slate-900/80 text-white hover:bg-slate-900 flex items-center justify-center" aria-label="Close">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                        </button>
                    </div>
                    <div class="mt-4 flex items-start justify-between gap-3">
                        <div>
                            <h3 id="ov-name" class="text-xl font-bold text-slate-900"></h3>
                            <p id="ov-cat" class="text-xs text-slate-400 capitalize"></p>
                        </div>
                        <p id="ov-price" class="text-lg font-bold text-amber-600 shrink-0"></p>
                    </div>
                    <p id="ov-desc" class="mt-2 text-sm text-slate-500 leading-relaxed"></p>
                </div>

                <div class="sticky bottom-0 bg-white border-t border-slate-100 p-4 flex items-center gap-3" style="padding-bottom:max(1rem,env(safe-area-inset-bottom))">
                    <div class="flex items-center bg-slate-100 rounded-xl">
                        <button onclick="changeQty(-1)" class="w-10 h-10 text-lg font-bold text-slate-600 hover:text-amber-600" aria-label="Decrease">&minus;</button>
                        <span id="ov-qty" class="w-8 text-center font-bold">1</span>
                        <button onclick="changeQty(1)" class="w-10 h-10 text-lg font-bold text-slate-600 hover:text-amber-600" aria-label="Increase">+</button>
                    </div>
                    <button onclick="addToCart()" class="flex-1 h-11 rounded-xl bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold shadow-md shadow-amber-900/20 active:scale-95 transition">
                        Add to cart (<span id="ov-total"></span>)
                    </button>
                </div>
            </div>
        </div>

        <div id="toast" class="absolute bottom-6 left-1/2 z-[60] bg-slate-900 text-white text-sm font-medium px-4 py-2.5 rounded-xl shadow-xl"></div>
    </div>

    <script>
        let menuItems = [];

        const peso = n => '₱ ' + Number(n).toFixed(2);
        const getCart = () => JSON.parse(sessionStorage.getItem('cart_items') || '[]');
        let state = { item: null, qty: 1 };

        async function loadMenu() {
            const cached = sessionStorage.getItem('cached_menu');
            if (cached) {
                try { menuItems = JSON.parse(cached); } catch(e){}
            }

            const c = (new URLSearchParams(location.search).get('category') || 'all').toLowerCase();
            filterCategory(c);

            try {
                const res = await fetch('/api/customer/menu', { headers: { Accept: 'application/json' } });
                if (res.ok) {
                    const freshData = await res.json();
                    menuItems = freshData;
                    sessionStorage.setItem('cached_menu', JSON.stringify(freshData));
                    filterCategory(c);
                }
            } catch (e) { /* keep cached data */ }
        }

        function renderMenu(filter = 'all') {
            const box = document.getElementById('menu-container');
            document.getElementById('category-title').innerText = filter === 'all' ? 'Full menu' : filter.replace(/\b\w/g, c => c.toUpperCase());
            const list = filter === 'all' ? menuItems : menuItems.filter(i => i.category === filter);
            if (!list.length) { box.innerHTML = '<p class="col-span-2 text-center text-slate-400 text-sm py-10">No items in this category yet.</p>'; return; }
            
            box.innerHTML = list.map((item) => {
                const out = item.status === 'sold out';
                return `
                <div class="relative overflow-hidden rounded-3xl shadow-sm card-in">
                    <!-- Swipe Reveal Backdrop -->
                    <div class="absolute inset-0 bg-emerald-500 rounded-3xl flex flex-col justify-center items-start pl-5 text-white font-bold pointer-events-none">
                        <div class="flex items-center gap-1.5">
                            <span class="text-lg font-black tracking-wider">+1</span>
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.3 2.3c-.6.6-.2 1.7.7 1.7H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
                            </svg>
                        </div>
                        <span class="text-[15px] font-bold tracking-tight opacity-95 mt-0.5">Add to cart</span>
                    </div>

                    <!-- Foreground Card Content -->
                    <div class="relative bg-white border border-amber-100 rounded-3xl p-2.5 flex flex-col h-full ${out ? 'opacity-60' : 'swipe-card'}" ${out ? '' : `data-swipe-id="${item.id}"`}>
                        <div class="relative aspect-square rounded-2xl bg-amber-100 flex items-center justify-center text-xs text-amber-700/60 font-medium overflow-hidden">
                            ${item.image ? `<img src="${item.image}" class="w-full h-full object-cover alt="">` : 'No photo'}
                            ${out ? '<span class="absolute top-2 left-2 bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">Sold out</span>' : ''}
                        </div>
                        <div class="px-1.5 pt-2.5 flex-1">
                            <h3 class="font-bold text-sm text-slate-900 leading-snug">${item.name}</h3>
                            <p class="text-[11px] text-slate-400 capitalize">${item.category}</p>
                            <p class="text-sm font-extrabold text-slate-900 mt-1">${peso(item.price)}</p>
                        </div>
                        ${out ? '<button disabled class="mt-2.5 w-full py-2 rounded-xl bg-slate-200 text-slate-400 text-xs font-bold cursor-not-allowed">Choose</button>'
                              : `<button onclick="chooseItem(${item.id})" class="mt-2.5 w-full py-2 rounded-xl bg-amber-400 hover:bg-amber-500 text-slate-900 text-xs font-bold shadow-sm transition">Choose</button>`}
                    </div>
                </div>`;
            }).join('');
        }

        function filterCategory(cat) {
            document.querySelectorAll('.category-tab').forEach(t => {
                t.classList.remove('bg-slate-900', 'text-white', 'shadow-sm');
                t.classList.add('bg-white', 'text-slate-600');
            });
            const tabKey = cat === 'all' ? 'tab-all' : 'tab-' + cat.split(' ')[0];
            const tab = document.getElementById(tabKey);
            if (tab) { 
                tab.classList.remove('bg-white', 'text-slate-600'); 
                tab.classList.add('bg-slate-900', 'text-white', 'shadow-sm'); 
                tab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }
            renderMenu(cat);
        }

        // ---- Item Detail Overlay ----
        function chooseItem(id) {
            const item = menuItems.find(i => i.id === id);
            if (!item || item.status === 'sold out') return;
            sessionStorage.setItem('selected_item_id', id);

            state = { item, qty: 1 };

            document.getElementById('ov-name').innerText = item.name;
            document.getElementById('ov-cat').innerText = item.category;
            document.getElementById('ov-price').innerText = peso(item.price);
            document.getElementById('ov-desc').innerText = item.description || 'No description available.';
            
            const img = document.getElementById('ov-img'), ph = document.getElementById('ov-img-ph');
            if (item.image) { img.src = item.image; img.classList.remove('hidden'); ph.classList.add('hidden'); }
            else { img.classList.add('hidden'); ph.classList.remove('hidden'); }

            refreshOverlay();
            document.getElementById('overlay-panel').scrollTop = 0;
            document.getElementById('overlay').classList.add('open');
        }

        function closeOverlay() {
            document.getElementById('overlay').classList.remove('open');
        }

        function changeQty(d) { state.qty = Math.max(1, state.qty + d); refreshOverlay(); }
        
        function refreshOverlay() {
            document.getElementById('ov-qty').innerText = state.qty;

            const btn = document.querySelector('#overlay button[onclick="addToCart()"]');
            if (btn) {
                btn.innerHTML = `Add to cart (${peso(state.item.price * state.qty)})`;
            }
        }

        function pushToCart(item, qty) {
            const cart = getCart();
            const key = item.id;
            const unit = item.price;
            
            const updatedItem = {
                key,
                id: item.id,
                name: item.name,
                category: item.category,
                image: item.image,
                price: unit,
                quantity: qty
            };
            
            const found = cart.find(c => c.key === key);
            if (found) found.quantity += qty;
            else cart.push(updatedItem);
            sessionStorage.setItem('cart_items', JSON.stringify(cart));
            updateBadge();
        }

        function addToCart() {
            pushToCart(state.item, state.qty);
            closeOverlay(); 
            showToast(`${state.item.name} added to cart`);

            const activeCard = document.querySelector(`[data-swipe-id="${state.item.id}"]`);
            if (activeCard) {
                animateFlyToCart(activeCard);
            }
        }

        function updateBadge() { 
            const cartBtn = document.getElementById('cart-btn');
            document.getElementById('cart-badge').innerText = getCart().reduce((s, i) => s + i.quantity, 0); 
            cartBtn.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.25)' }, { transform: 'scale(1)' }], { duration: 300 });
        }
        
        function showToast(msg) {
            const t = document.getElementById('toast'); t.innerText = msg; t.classList.add('show');
            clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2200);
        }

        //Fly to cart animation after swipe
        function animateFlyToCart(sourceCard) {
            const imgEl = sourceCard.querySelector('img');
            const cartBtn = document.getElementById('cart-btn');
            if (!cartBtn) return;

            const sourceRect = sourceCard.getBoundingClientRect();
            const cartRect = cartBtn.getBoundingClientRect();

            const flyEl = document.createElement('div');
            flyEl.style.cssText = `
                position: fixed;
                z-index: 100;
                left: ${sourceRect.left}px;
                top: ${sourceRect.top}px;
                width: ${sourceRect.width}px;
                height: ${sourceRect.height}px;
                pointer-events: none;
                border-radius: 1.5rem;
                background-color: #fef3c7;
                overflow: hidden;
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
                transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.45s linear;
            `;

            if (imgEl && imgEl.src) {
                flyEl.innerHTML = `<img src="${imgEl.src}" class="w-full h-full object-cover">`;
            } else {
                flyEl.className += ' flex items-center justify-center text-xs text-amber-700/60 font-medium';
                flyEl.innerText = 'No photo';
            }

            document.body.appendChild(flyEl);

            const deltaX = (cartRect.left + cartRect.width / 2) - (sourceRect.left + sourceRect.width / 2);
            const deltaY = (cartRect.top + cartRect.height / 2) - (sourceRect.top + sourceRect.height / 2);

            requestAnimationFrame(() => {
                flyEl.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(0.15)`;
                flyEl.style.opacity = '0.2';
            });

            setTimeout(() => {
                flyEl.remove();
                updateBadge();
            }, 450);
        }

        // ---- SWIPE-RIGHT QUICK ADD GESTURE ----
        let swipe = { card: null, item: null, x0: 0, y0: 0, dx: 0, tracking: false, active: false };
        const THRESHOLD = 72; // minimum px swipe to commit quick-add

        document.getElementById('menu-container').addEventListener('pointerdown', e => {
            const card = e.target.closest('[data-swipe-id]');
            if (!card || e.target.closest('button') || (e.pointerType === 'mouse' && e.button !== 0)) return;
            swipe.card = card;
            swipe.item = menuItems.find(i => String(i.id) === card.dataset.swipeId);
            swipe.x0 = e.clientX;
            swipe.y0 = e.clientY;
            swipe.dx = 0;
            swipe.tracking = true;
            swipe.active = false;
        });

        document.addEventListener('pointermove', e => {
            if (!swipe.tracking || !swipe.card) return;
            const dx = e.clientX - swipe.x0;
            const dy = e.clientY - swipe.y0;

            if (!swipe.active) {
                if (Math.abs(dy) > Math.abs(dx) || Math.abs(dy) > 12) {
                    swipe.tracking = false;
                    return;
                }
                if (dx > 8) {
                    swipe.active = true;
                    swipe.card.style.transition = 'none';
                }
            }

            if (swipe.active && dx >= 0) {
                swipe.dx = Math.min(dx, 110);
                swipe.card.style.transform = `translateX(${swipe.dx}px)`;
            }
        });

        function resetSwipeCard() {
            if (swipe.card) {
                swipe.card.style.transition = 'transform .25s ease-out';
                swipe.card.style.transform = 'translateX(0)';
            }
            swipe = { card: null, item: null, x0: 0, y0: 0, dx: 0, tracking: false, active: false };
        }

        document.addEventListener('pointerup', () => {
            if (swipe.active && swipe.item) {
                if (swipe.dx >= THRESHOLD) {
                    if (navigator.vibrate) navigator.vibrate(12);
                    pushToCart(swipe.item, 1);
                    showToast(`1x ${swipe.item.name} added to cart`);
                    animateFlyToCart(swipe.card);
                }
            }
            resetSwipeCard();
        });

        document.addEventListener('pointercancel', resetSwipeCard);

        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlay(); });
        document.addEventListener('DOMContentLoaded', () => { 
            loadMenu(); 
            updateBadge();
        });
    </script>
</body>
</html>
